 <text class="sans" x="86" y="48" font-size="19" font-weight="700" fill="#fff">Lumen <tspan class="mono" font-size="13" font-weight="500" fill="#fff" fill-opacity=".5" dx="4">main</tspan></text>
 <text class="sans job0" x="86" y="72" font-size="15" font-weight="500" fill="#AEB5C4">Lint · job 1 of 4</text><text class="sans job1" x="86" y="72" font-size="15" font-weight="500" fill="#AEB5C4">Test · job 2 of 4</text><text class="sans job2" x="86" y="72" font-size="15" font-weight="500" fill="#AEB5C4">Build · job 3 of 4</text><text class="sans job3" x="86" y="72" font-size="15" font-weight="500" fill="#AEB5C4">Deploy · job 4 of 4</text>
 <text class="sans passed" x="86" y="72" font-size="15" font-weight="600" fill="#30D158">Passed in 1m 12s</text>
 <g class="running">
  <circle cx="338" cy="50" r="13" fill="none" stroke="#FF9F0A" stroke-opacity=".25" stroke-width="4"/>
  <circle class="spin" cx="338" cy="50" r="13" fill="none" stroke="#FF9F0A" stroke-width="4" stroke-linecap="round" stroke-dasharray="22 60"/>
 </g>
 <g class="passed">
  <circle cx="338" cy="50" r="15" fill="#30D158"/>
  <path d="M331 50.5l5 5 9-10" fill="none" stroke="#000" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
 </g>
 <rect x="28" y="104" width="75" height="7" rx="3.5" fill="#fff" fill-opacity=".14"/><rect class="fill0" x="28" y="104" width="75" height="7" rx="3.5" fill="#FF9F0A"/><rect class="pass0" x="28" y="104" width="75" height="7" rx="3.5" fill="#30D158"/><rect x="111" y="104" width="75" height="7" rx="3.5" fill="#fff" fill-opacity=".14"/><rect class="fill1" x="111" y="104" width="75" height="7" rx="3.5" fill="#FF9F0A"/><rect class="pass1" x="111" y="104" width="75" height="7" rx="3.5" fill="#30D158"/><rect x="194" y="104" width="75" height="7" rx="3.5" fill="#fff" fill-opacity=".14"/><rect class="fill2" x="194" y="104" width="75" height="7" rx="3.5" fill="#FF9F0A"/><rect class="pass2" x="194" y="104" width="75" height="7" rx="3.5" fill="#30D158"/><rect x="277" y="104" width="75" height="7" rx="3.5" fill="#fff" fill-opacity=".14"/><rect class="fill3" x="277" y="104" width="75" height="7" rx="3.5" fill="#FF9F0A"/><rect class="pass3" x="277" y="104" width="75" height="7" rx="3.5" fill="#30D158"/>
</g>
 <g transform="translate(40 40) scale(1.3076923076923077)"><g><rect width="52" height="52" rx="13" fill="url(#ic-shipyard)"/><rect width="52" height="52" rx="13" fill="url(#gloss)"/><rect x=".5" y=".5" width="51" height="51" rx="12.5" fill="none" stroke="#fff" stroke-opacity=".2"/><defs><linearGradient id="ic-sail" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFB24D"/><stop offset="1" stop-color="#FF5A3C"/></linearGradient></defs><g transform="translate(8 9.9) scale(.0542) translate(-180 -216)"><path d="M512 250V552H776Z" fill="url(#ic-sail)" stroke="url(#ic-sail)" stroke-width="36" stroke-linejoin="round"/><path d="M452 352V552H292Z" fill="#fff" stroke="#fff" stroke-width="36" stroke-linejoin="round"/><rect x="196" y="622" width="632" height="172" rx="86" fill="#fff"/><rect x="270" y="690" width="196" height="36" rx="18" fill="#0B0E18"/><circle cx="724" cy="708" r="52" fill="#0B0E18"/><circle cx="724" cy="708" r="38" fill="#30D158"/></g></g></g>
 <rect x="124" y="60" width="117" height="28" rx="14" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".16"/>
 <circle class="pulse" cx="139" cy="74" r="4" fill="#30D158"/>
 <text x="151" y="78.5" class="mono" font-size="12" font-weight="600" letter-spacing="1.8" fill="#DDE1EA">BUILDING</text>
 <text x="38" y="172" class="sans" font-size="46" font-weight="800" letter-spacing="-1" fill="#fff">Shipyard</text>
 <text x="40" y="201" class="mono" font-size="13.5" font-weight="600" letter-spacing="1.9" fill="#FFA24A">SWIFTUI · LIVE ACTIVITIES · SPRING BOOT</text>
 <text x="40" y="237" class="sans" font-size="19.5" font-weight="500" fill="#AEB5C4">Your GitHub Actions runs on the Dynamic Island and Lock</text>
