<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" width="1280" height="300" role="img" aria-label="Shipyard: Your GitHub Actions runs on the Dynamic Island and Lock Screen. Nothing to add to your workflows.">
<title>Shipyard</title>
<defs>
 <clipPath id="frame"><rect width="1280" height="300" rx="24"/></clipPath>
 <radialGradient id="glowA"><stop offset="0" stop-color="#FFA24A" stop-opacity=".42"/><stop offset="1" stop-color="#FFA24A" stop-opacity="0"/></radialGradient>
 <radialGradient id="glowB"><stop offset="0" stop-color="#FF5A3C" stop-opacity=".2"/><stop offset="1" stop-color="#FF5A3C" stop-opacity="0"/></radialGradient>
 <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/></linearGradient><linearGradient id="ic-shipyard" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B2440"/><stop offset="1" stop-color="#080A11"/></linearGradient>
 <clipPath id="holoClip"><rect width="300" height="184" rx="22"/></clipPath>
 <linearGradient id="rainbow" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="300" y2="0" spreadMethod="repeat"><stop offset="0" stop-color="#FF5F6D"/><stop offset=".2" stop-color="#FFC371"/><stop offset=".4" stop-color="#47E5BC"/><stop offset=".6" stop-color="#5B8CFF"/><stop offset=".8" stop-color="#B26BFF"/><stop offset="1" stop-color="#FF5F6D"/></linearGradient>
 <linearGradient id="holoShade" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A0B0F" stop-opacity=".5"/><stop offset=".6" stop-color="#0A0B0F" stop-opacity=".12"/><stop offset="1" stop-color="#0A0B0F" stop-opacity=".4"/></linearGradient>
 <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(38)"><rect width="1.2" height="7" fill="#fff" fill-opacity=".13"/></pattern>
</defs>
<style>
.sans{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,'JetBrains Mono',Consolas,monospace}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.rise{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}
@keyframes pop{0%{opacity:0;transform:scale(.4)}70%{opacity:1;transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .55s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.pulse{animation:pulse 2.2s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@keyframes foil{from{transform:translateX(0)}to{transform:translateX(300px)}}
.foil{animation:foil 7s linear infinite}
@keyframes shine{0%,35%{transform:translateX(0)}75%,100%{transform:translateX(560px)}}
.shine{animation:shine 4.5s ease-in-out infinite}
@keyframes fill0{0%,0%{transform:scaleX(0)}20%,100%{transform:scaleX(1)}}@keyframes pass0{0%,20%{opacity:0}21.5%,100%{opacity:1}}@keyframes job0{0%,20%{opacity:1}21.5%,100%{opacity:0}}.fill0{transform-box:fill-box;transform-origin:left center;animation:fill0 12s linear infinite}.pass0{animation:pass0 12s linear infinite}.job0{animation:job0 12s linear infinite}@keyframes fill1{0%,20%{transform:scaleX(0)}40%,100%{transform:scaleX(1)}}@keyframes pass1{0%,40%{opacity:0}41.5%,100%{opacity:1}}@keyframes job1{0%,20%{opacity:0}21.5%,40%{opacity:1}41.5%,100%{opacity:0}}.fill1{transform-box:fill-box;transform-origin:left center;animation:fill1 12s linear infinite}.pass1{animation:pass1 12s linear infinite}.job1{animation:job1 12s linear infinite}@keyframes fill2{0%,40%{transform:scaleX(0)}60%,100%{transform:scaleX(1)}}@keyframes pass2{0%,60%{opacity:0}61.5%,100%{opacity:1}}@keyframes job2{0%,40%{opacity:0}41.5%,60%{opacity:1}61.5%,100%{opacity:0}}.fill2{transform-box:fill-box;transform-origin:left center;animation:fill2 12s linear infinite}.pass2{animation:pass2 12s linear infinite}.job2{animation:job2 12s linear infinite}@keyframes fill3{0%,60%{transform:scaleX(0)}78%,100%{transform:scaleX(1)}}@keyframes pass3{0%,78%{opacity:0}79.5%,100%{opacity:1}}@keyframes job3{0%,60%{opacity:0}61.5%,78%{opacity:1}79.5%,100%{opacity:0}}.fill3{transform-box:fill-box;transform-origin:left center;animation:fill3 12s linear infinite}.pass3{animation:pass3 12s linear infinite}.job3{animation:job3 12s linear infinite}@keyframes running{0%,78%{opacity:1}79.5%,100%{opacity:0}}@keyframes passed{0%,78%{opacity:0}79.5%,100%{opacity:1}}.running{animation:running 12s linear infinite}.passed{animation:passed 12s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.spin{transform-box:fill-box;transform-origin:center;animation:spin 1s linear infinite}
</style>
