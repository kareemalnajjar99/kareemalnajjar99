<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" width="1280" height="300" role="img" aria-label="Lumen: Metal-powered effects for SwiftUI. Holographic cards, liquid transitions, touch ripples. One modifier each.">
<title>Lumen</title>
<defs>
 <clipPath id="frame"><rect width="1280" height="300" rx="24"/></clipPath>
 <radialGradient id="glowA"><stop offset="0" stop-color="#B26BFF" stop-opacity=".42"/><stop offset="1" stop-color="#B26BFF" stop-opacity="0"/></radialGradient>
 <radialGradient id="glowB"><stop offset="0" stop-color="#FF4D8D" stop-opacity=".2"/><stop offset="1" stop-color="#FF4D8D" stop-opacity="0"/></radialGradient>
 <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/></linearGradient><linearGradient id="ic-lumen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#B26BFF"/><stop offset="1" stop-color="#FF4D8D"/></linearGradient>
 <clipPath id="holoClip"><rect width="300" height="184" rx="22"/></clipPath>
 <linearGradient id="rainbow" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="300" y2="0" spreadMethod="repeat"><stop offset="0" stop-color="#FF5F6D"/><stop offset=".2" stop-color="#FFC371"/><stop offset=".4" stop-color="#47E5BC"/><stop offset=".6" stop-color="#5B8CFF"/><stop offset=".8" stop-color="#B26BFF"/><stop offset="1" stop-color="#FF5F6D"/></linearGradient>
 <linearGradient id="holoShade" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A0B0F" stop-opacity=".5"/><stop offset=".6" stop-color="#0A0B0F" stop-opacity=".12"/><stop offset="1" stop-color="#0A0B0F" stop-opacity=".4"/></linearGradient>
 <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(38)"><rect width="1.2" height="7" fill="#fff" fill-opacity=".13"/></pattern>
</defs>
<style>
.sans{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,'JetBrains Mono',Consolas,monospace}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.rise{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}
@keyframes pop{0%{opacity:0;transform:scale(.4)}70%{opacity:1;transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .55s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.pulse{animation:pulse 2.2s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@keyframes foil{from{transform:translateX(0)}to{transform:translateX(300px)}}
.foil{animation:foil 7s linear infinite}
@keyframes shine{0%,35%{transform:translateX(0)}75%,100%{transform:translateX(560px)}}
.shine{animation:shine 4.5s ease-in-out infinite}

</style>
<g clip-path="url(#frame)">
 <rect width="1280" height="300" fill="#08090D"/>
 <circle cx="1260" cy="-20" r="560" fill="url(#glowA)"/>
 <circle cx="0" cy="340" r="420" fill="url(#glowB)"/>
 
<g transform="translate(1010 150) rotate(7) translate(-150 -92)">
 <rect width="300" height="184" rx="22" fill="#fff" fill-opacity=".04" stroke="#fff" stroke-opacity=".14"/>
</g>
<g transform="translate(980 152) rotate(-8) translate(-150 -92)">
 <g clip-path="url(#holoClip)">
  <g transform="skewX(-24)"><rect class="foil" x="-400" y="0" width="1100" height="184" fill="url(#rainbow)"/></g>
  <rect width="300" height="184" fill="url(#holoShade)"/>
  <rect width="300" height="184" fill="url(#hatch)"/>
  <g transform="skewX(-24)"><rect class="shine" x="-140" y="0" width="70" height="184" fill="#fff" fill-opacity=".34"/></g>
  <rect x="24" y="26" width="46" height="34" rx="8" fill="#fff" fill-opacity=".9"/>
  <path d="M24 43h46M40 26v34M54 26v34" stroke="#0A0B0F" stroke-opacity=".28" stroke-width="1.5"/>
  <g fill="#fff" fill-opacity=".92">
   <circle cx="30" cy="112" r="3.4"/><circle cx="41" cy="112" r="3.4"/><circle cx="52" cy="112" r="3.4"/><circle cx="63" cy="112" r="3.4"/><circle cx="94" cy="112" r="3.4"/><circle cx="105" cy="112" r="3.4"/><circle cx="116" cy="112" r="3.4"/><circle cx="127" cy="112" r="3.4"/><circle cx="158" cy="112" r="3.4"/><circle cx="169" cy="112" r="3.4"/><circle cx="180" cy="112" r="3.4"/><circle cx="191" cy="112" r="3.4"/><circle cx="222" cy="112" r="3.4"/><circle cx="233" cy="112" r="3.4"/><circle cx="244" cy="112" r="3.4"/><circle cx="255" cy="112" r="3.4"/>
  </g>
  <rect x="24" y="142" width="96" height="9" rx="4.5" fill="#fff" fill-opacity=".85"/>
  <rect x="232" y="138" width="44" height="18" rx="9" fill="#fff" fill-opacity=".5"/>
 </g>
 <rect x=".75" y=".75" width="298.5" height="182.5" rx="21.5" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="1.5"/>
</g>
 <g transform="translate(40 40) scale(1.3076923076923077)"><g><rect width="52" height="52" rx="13" fill="url(#ic-lumen)"/><rect width="52" height="52" rx="13" fill="url(#gloss)"/><rect x=".5" y=".5" width="51" height="51" rx="12.5" fill="none" stroke="#fff" stroke-opacity=".2"/><path d="M26 8.5C27.6 19.4 32.6 24.4 43.5 26 32.6 27.6 27.6 32.6 26 43.5 24.4 32.6 19.4 27.6 8.5 26 19.4 24.4 24.4 19.4 26 8.5Z" fill="#fff"/><circle cx="40.5" cy="12" r="2.6" fill="#fff" fill-opacity=".85"/></g></g>
 <rect x="124" y="60" width="146" height="28" rx="14" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".16"/>
 <circle cx="139" cy="74" r="4" fill="#8E96A8"/>
 <text x="151" y="78.5" class="mono" font-size="12" font-weight="600" letter-spacing="1.8" fill="#DDE1EA">VERSION 1.0</text>
 <text x="38" y="172" class="sans" font-size="46" font-weight="800" letter-spacing="-1" fill="#fff">Lumen</text>
 <text x="40" y="201" class="mono" font-size="13.5" font-weight="600" letter-spacing="1.9" fill="#B26BFF">SWIFT PACKAGE · METAL · SWIFTUI</text>
 <text x="40" y="237" class="sans" font-size="19.5" font-weight="500" fill="#AEB5C4">Metal-powered effects for SwiftUI. Holographic cards, liquid</text>
 <text x="40" y="264" class="sans" font-size="19.5" font-weight="500" fill="#AEB5C4">transitions, touch ripples. One modifier each.</text>
 
</g>
<rect x=".5" y=".5" width="1279" height="299" rx="23.5" fill="none" stroke="#fff" stroke-opacity=".12"/>
</svg>
